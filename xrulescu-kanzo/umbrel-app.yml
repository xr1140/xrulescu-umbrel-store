manifestVersion: 1
id: xrulescu-kanzo
category: developer
name: Kanzo
version: "0.3.2"
tagline: A tiny kanban board for you and your coding agents
icon: https://raw.githubusercontent.com/emanuele-em/kanzo/main/src/logo.png
description: >-
  Kanzo is a kanban board in your browser and an MCP server in one small
  program, so you and your coding agents work on the same tasks. No account,
  no setup: the board opens and everything lives in this app's data folder.


  Tasks are created and moved on the board, from the `kanzo` command, or by
  agents over MCP. Mark a task Human and agents leave it to you. Press `n` for
  a new task, `/` or `⌘K` to search every project, `f` to filter.


  This package serves the board through Umbrel, so Umbrel's login protects it
  on your network. Kanzo's own Share and Join buttons are not used here: the
  board already listens inside its container. Data stays in this app's data
  folder and is included in Umbrel backups.


  Agents connect to Kanzo's MCP server at `http://<umbrel-ip>:4242/mcp`. Port
  4242 has no login, so keep it on a trusted network or use a VPN; the board on
  port 4290 stays behind Umbrel's login.


  Updates arrive through Umbrel's app store; Kanzo's self-update is disabled
  in this package.
developer: Emanuele Micheletti
website: https://github.com/emanuele-em/kanzo
dependencies: []
repo: https://github.com/emanuele-em/kanzo
support: https://github.com/emanuele-em/kanzo/issues
port: 4290
gallery:
  - https://raw.githubusercontent.com/emanuele-em/kanzo/main/docs/img/board-light.gif
  - https://raw.githubusercontent.com/emanuele-em/kanzo/main/docs/img/task-light.jpg
  - https://raw.githubusercontent.com/emanuele-em/kanzo/main/docs/img/share-light.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  Adds an Umbrel home-screen widget with task counts for Todo, Doing, Review
  and Done. The widget reads a new /api/widget endpoint inside the Kanzo
  container and does not change the board's data or ports.
submitter: XRulescu
submission:
widgets:
  - id: "task-counts"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:4242/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Todo"
          text: "12"
        - title: "Doing"
          text: "3"
        - title: "Review"
          text: "1"
        - title: "Done"
          text: "42"
