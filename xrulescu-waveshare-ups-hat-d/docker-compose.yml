services:
  app_proxy:
    environment:
      APP_HOST: xrulescu-waveshare-ups-hat-d_server_1
      APP_PORT: 1140
      PROXY_AUTH_ADD: "false"
      
  # Flask API server providing:
  # - GET / → HTML dashboard for monitoring
  # - GET /api/info → Full JSON API with battery/power metrics
  # - GET /widgets/ups → umbrelOS widget (four-stats: Battery %, Status, Voltage, Power)
  server:
    image: xr1140/ups_hat_d-api:0.1.8@sha256:7f739ea58242ac4bb0347a08fd4ea61ced7d52b6d8fcceb054a7d5f8ca6f4df9
    group_add:
      - 1015 # GID-ul grupului i2c pe gazda
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    #    container_name: waveshare-ups-hat
    restart: unless-stopped
