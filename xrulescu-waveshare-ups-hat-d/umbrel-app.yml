manifestVersion: 1
id: xrulescu-waveshare-ups-hat-d
storage:
  dataRoot: data
name: Waveshare UPS Hat D
category: Monitoring
version: "0.1.4"
tagline: UPS Hat for Raspberry Pi 4.
icon: https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/icon.svg
description: >
  The UPS HAT (D) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app. Do not use it on a Raspberry Pi 5, Use the UPS Hat (E) instead.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-d.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-3.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-9.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-7.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - History storage (connection, schema, append, age-based retention, read) moves to `shared/history.py` and is used by both apps. No behavior change: the same rows are written and `/api/history` returns the same JSON.
  - Both images now build from the repository root so `shared/` is in the build context. The two per-app `.dockerignore` files are replaced by one at the root, and the local build scripts pass the app Dockerfile with `-f`.
  - Tests grow to 20, six of them covering the shared module.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "75"
          subtext: "%"
        - title: "Status"
          text: "Discharging"
        - title: "Current"
          text: "-1500"
          subtext: "mA"
        - title: "Power"
          text: "7.50"
          subtext: "W"
