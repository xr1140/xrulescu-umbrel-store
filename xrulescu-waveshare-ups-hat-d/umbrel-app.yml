manifestVersion: 1
id: xrulescu-waveshare-ups-hat-d
storage:
  dataRoot: data
name: Waveshare UPS Hat D
category: Monitoring
version: "0.1.3"
tagline: UPS Hat for Raspberry Pi 4.
icon: https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/icon.svg
description: >
  The UPS HAT (D) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app. Do not use it on a Raspberry Pi 5, Use the UPS Hat (E) instead.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-d.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-3.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-9.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-d/assets/ups-hat-d-details-7.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - History retention deletes rows older than 15 days through the indexed `ts` column instead of rescanning 43,200 rowids on every insert.
  - SQLite connections are kept per thread and dropped after an error, so one read no longer opens and closes two of them.
  - The dashboard fetches 2 hours by default; the chart button loads 7 days on demand. Wide windows label points with the date, so tooltips and axis ticks show which day a point belongs to.
  - Switching between 2 hours and 7 days resets the zoom plugin, which otherwise kept a label-index range from the previous window and could leave the chart blank.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "75"
          subtext: "%"
        - title: "Status"
          text: "Discharging"
        - title: "Current"
          text: "-1500"
          subtext: "mA"
        - title: "Power"
          text: "7.50"
          subtext: "W"
