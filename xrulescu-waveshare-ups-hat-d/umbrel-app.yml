manifestVersion: 1
id: xrulescu-waveshare-ups-hat-d
name: Waveshare UPS Hat D
category: Monitoring
version: "0.0.35"
tagline: UPS Hat for Raspberry Pi 4.
icon: https://www.waveshare.com/w/upload/a/a7/Ws-watermark-en.svg
description: >
  The UPS HAT (D) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app. Do not use it on a Raspberry Pi 5, Use the UPS Hat (E) instead.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-d.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-D/UPS-HAT-D-details-3.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-D/UPS-HAT-D-details-9.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-D/UPS-HAT-D-details-7.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >
  - Integrated umbrelOS widget endpoint for dashboard display
  - Widget shows battery percentage, status, current, and power
  - Single Flask server handles all endpoints (web interface, API, widget)
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "75"
          subtext: "%"
        - title: "Status"
          text: "Discharging"
        - title: "Current"
          text: "-1500"
          subtext: "mA"
        - title: "Power"
          text: "7.50"
          subtext: "W"
