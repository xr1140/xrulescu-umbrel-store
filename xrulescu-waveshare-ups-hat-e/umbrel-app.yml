manifestVersion: 1
id: xrulescu-waveshare-ups-hat-e
storage:
  dataRoot: data
name: Waveshare UPS Hat E
category: Monitoring
version: "0.1.4"
tagline: UPS Hat (E) for Raspberry Pi 4/5.
icon: https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/icon.svg
description: >
  The UPS HAT (E) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-e.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/ups-hat-e-details-1.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-1.png
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-2.png
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - History storage (connection, schema, append, age-based retention, read) moves to `shared/history.py` and is used by both apps. The calibration table is created through `ensure(extra_ddl=...)`, and the baseline read and update use the same connection. No behavior change: the same rows are written and `/api/history` returns the same JSON.
  - Both images now build from the repository root so `shared/` is in the build context. The two per-app `.dockerignore` files are replaced by one at the root, and the local build scripts pass the app Dockerfile with `-f`.
  - Tests grow to 20, six of them covering the shared module.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "85"
          subtext: "%"
        - title: "Status"
          text: "Charging"
        - title: "Current"
          text: "+2500"
          subtext: "mA"
        - title: "Power"
          text: "31.25"
          subtext: "W"
