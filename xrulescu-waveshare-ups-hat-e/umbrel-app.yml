manifestVersion: 1
id: xrulescu-waveshare-ups-hat-e
storage:
  dataRoot: data
name: Waveshare UPS Hat E
category: Monitoring
version: "0.1.9"
tagline: UPS Hat (E) for Raspberry Pi 4/5.
icon: https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/icon.svg
description: >
  The UPS HAT (E) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-e.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/ups-hat-e-details-1.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-1.png
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-2.png
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - The image is about half the size: the unused apt packages (`gosu`, `i2c-tools`, `libi2c-dev`, `python3-smbus2`) are gone, and pip and setuptools are stripped after the install. `python3-smbus2` was pulling Debian's Python and its stdlib, which the app never used. 294 MB to 152 MB on arm64.
  - `i2c-tools` is no longer inside the container; debug the bus from the host with `sudo i2cdetect -y 1`. The app reads it through `smbus2`.
  - Asset URLs carry the app version, so an update no longer needs a hard reload to pick up new CSS or JavaScript.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "85"
          subtext: "%"
        - title: "Status"
          text: "Charging"
        - title: "Current"
          text: "+2500"
          subtext: "mA"
        - title: "Power"
          text: "31.25"
          subtext: "W"
