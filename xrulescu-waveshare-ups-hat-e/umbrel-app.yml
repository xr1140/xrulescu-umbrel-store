manifestVersion: 1
id: xrulescu-waveshare-ups-hat-e
name: Waveshare UPS Hat E
category: Monitoring
version: "0.1.1"
tagline: UPS Hat (E) for Raspberry Pi 4/5.
icon: https://www.waveshare.com/w/upload/a/a7/Ws-watermark-en.svg
description: >
  The UPS HAT (E) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-e.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-D/UPS-HAT-D-details-3.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-E/UPS-HAT-E-details-1.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-E/UPS-HAT-E-details-2.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - `/api/info` adds a `version` key read from `VERSION`, which the Dockerfile copies to `/app/VERSION`; it is `"unknown"` when the file is missing.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "85"
          subtext: "%"
        - title: "Status"
          text: "Charging"
        - title: "Current"
          text: "+2500"
          subtext: "mA"
        - title: "Power"
          text: "31.25"
          subtext: "W"
