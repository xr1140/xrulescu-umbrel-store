manifestVersion: 1
id: xrulescu-waveshare-ups-hat-e
name: Waveshare UPS Hat E - API Endpoint
category: Monitoring
version: "0.0.22"
tagline: UPS Hat (E) for Raspberry Pi 4/5.
icon: https://www.waveshare.com/w/upload/a/a7/Ws-watermark-en.svg
description: >
  The UPS HAT (E) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-e.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-D/UPS-HAT-D-details-3.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-E/UPS-HAT-E-details-1.jpg
  - https://www.waveshare.com/img/devkit/accBoard/UPS-HAT-E/UPS-HAT-E-details-2.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >
  - Integrated umbrelOS widget endpoint for dashboard display
  - Widget shows battery percentage, status, voltage, and power consumption
  - Single Flask server handles all endpoints (web interface, API, widget)
submitter: XRulescu
developer: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "localhost:1140/widgets/ups"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "-"
          subtext: "%"
        - title: "Status"
          text: "-"
        - title: "Voltage"
          text: "-"
          subtext: "V"
        - title: "Power"
          text: "-"
          subtext: "W"
