manifestVersion: 1
id: xrulescu-waveshare-ups-hat-e
storage:
  dataRoot: data
name: Waveshare UPS Hat E
category: Monitoring
version: "0.1.3"
tagline: UPS Hat (E) for Raspberry Pi 4/5.
icon: https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/icon.svg
description: >
  The UPS HAT (E) is an uninterruptible power supply (UPS) expansion board specially designed for the Raspberry Pi series.
  You need I2C enabled on your Raspberry Pi to use this app.
developer: XRulescu
website: https://www.waveshare.com/ups-hat-e.htm
dependencies: []
support: https://github.com/xr1140/xrulescu-umbrel-store
port: 1140
gallery:
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/ups-hat-e-details-1.jpg
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-1.png
  - https://raw.githubusercontent.com/xr1140/xrulescu-umbrel-store/master/xrulescu-waveshare-ups-hat-e/assets/screenshot-2.png
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: |
  - History retention deletes rows older than 15 days through the indexed `ts` column instead of rescanning 43,200 rowids on every insert.
  - SQLite connections are kept per thread and dropped after an error. The calibration baseline is read and updated through the same connection, and `_apply_calibrated_percent` takes it as an argument.
  - The dashboard fetches 2 hours by default; the chart button loads 7 days on demand. Wide windows label points with the date, so tooltips and axis ticks show which day a point belongs to.
  - Switching between 2 hours and 7 days resets the zoom plugin, which otherwise kept a label-index range from the previous window and could leave the chart blank.
submitter: XRulescu
widgets:
  - id: "battery-stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "server:1140/api/widget"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Battery"
          text: "85"
          subtext: "%"
        - title: "Status"
          text: "Charging"
        - title: "Current"
          text: "+2500"
          subtext: "mA"
        - title: "Power"
          text: "31.25"
          subtext: "W"
