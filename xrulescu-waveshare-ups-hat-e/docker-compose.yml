services:
  # Umbrel reverse proxy - forwards HTTP requests to Flask server
  app_proxy:
    environment:
      APP_HOST: xrulescu-waveshare-ups-hat-e_server_1
      APP_PORT: 1140
      PROXY_AUTH_ADD: "false"

  # Flask API server providing:
  # - GET / → HTML dashboard for monitoring
  # - GET /api/info → Full JSON API with battery/power metrics
  # - GET /widgets/ups → umbrelOS widget (four-stats: Battery %, Status, Voltage, Power)
  server:
    image: xr1140/ups_hat_e-api:0.1.1@sha256:73b4939b4e7bc0573e4d2d58a2ee787f95bbe9a7e329640e0d0260c675d4f391
    group_add:
      - 1015 # I2C group GID for Raspberry Pi I2C device access
    devices:
      - /dev/i2c-1:/dev/i2c-1
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    restart: unless-stopped
